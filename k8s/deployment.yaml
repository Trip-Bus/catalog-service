# Despliegue en Kubernetes de catalog-service (namespace tripbus).
# Requiere los recursos compartidos de API-gateway/k8s/infra (ConfigMap, Secret, PostgreSQL, Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: tripbus
  labels:
    app: catalog-service
    app.kubernetes.io/part-of: tripbus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog-service
        app.kubernetes.io/part-of: tripbus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "16002"
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/trip-bus/catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 16002
              name: http
          envFrom:
            - configMapRef:
                name: tripbus-config
            - secretRef:
                name: tripbus-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: tripbus
  labels:
    app: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 16002
      targetPort: http
