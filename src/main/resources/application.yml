spring:
  application:
    name: catalog-service

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18102}/${DB_NAME:tripbus_catalog}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:18001/.well-known/jwks.json}

# HT-10: logs. Texto legible con traceId, spanId y requestId (del MDC) por defecto; con LOG_FORMAT=json, una
# línea JSON por evento en formato ECS (logging.structured.format.console=ecs, ver ObservabilityEnvironment),
# que incluye todo el MDC (traceId, spanId, requestId).
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{traceId:-},%X{spanId:-}] [%X{requestId:-}]){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

server:
  port: ${SERVER_PORT:18002}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: catalog-service
  # HT-10: trazas. Se muestrea TRACING_SAMPLING (10 % por defecto) y se exportan por OTLP/HTTP solo si
  # OTEL_EXPORTER_OTLP_ENDPOINT tiene valor (vacío = no se exportan; ver ObservabilityEnvironment).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  info:
    env:
      enabled: true

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  # HT-10: "json" activa los logs ECS (ver ObservabilityEnvironment). En prod es json por defecto.
  log-format: ${LOG_FORMAT:text}
  # HT-10: URL del servidor que muestra Swagger (p. ej. la del API Gateway). Vacía: la del propio servicio.
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:18000,http://localhost:3000,http://localhost:5173}
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: catalog-service
  services:
    seat-inventory-url: ${SEAT_INVENTORY_URL:http://localhost:18003}
  search:
    cache-ttl-seconds: 45
  catalog:
    default-commission: ${TRIPBUS_CATALOG_DEFAULT_COMMISSION:5.00}
    default-monthly-fee: ${TRIPBUS_CATALOG_DEFAULT_MONTHLY_FEE:0.00}
    # GET /trips/in-progress: viajes con fechaSalida - before <= ahora <= fechaLlegadaEstimada + after.
    # Mismo criterio que tracking-window-before/after de fleet-trip-events-service.
    in-progress-before: 30m
    in-progress-after: 30m
    # US-117: alistamiento mínimo de un bus entre la llegada de un viaje y la salida del siguiente.
    bus-turnaround: 30m
    # US-118: hasta cuánto se puede correr una salida hacia adelante y seguir siendo un RETRASO (si no, REPROGRAMACION).
    max-delay: 6h
    # US-138: el precio de un tramo nunca es menor que este porcentaje del precio del recorrido completo.
    min-segment-percent: ${TRIPBUS_CATALOG_MIN_SEGMENT_PERCENT:30}
  seed:
    on-startup: ${SEED_ON_STARTUP:true}
