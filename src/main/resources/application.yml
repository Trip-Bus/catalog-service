spring:
  application:
    name: catalog-service

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18102}/${DB_NAME:tripbus_catalog}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:18001/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:18002}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: catalog-service
  info:
    env:
      enabled: true

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:18000,http://localhost:3000,http://localhost:5173}
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: catalog-service
  services:
    seat-inventory-url: ${SEAT_INVENTORY_URL:http://localhost:18003}
  search:
    cache-ttl-seconds: 45
  catalog:
    default-commission: ${TRIPBUS_CATALOG_DEFAULT_COMMISSION:5.00}
    default-monthly-fee: ${TRIPBUS_CATALOG_DEFAULT_MONTHLY_FEE:0.00}
    # GET /trips/in-progress: viajes con fechaSalida - before <= ahora <= fechaLlegadaEstimada + after.
    # Mismo criterio que tracking-window-before/after de fleet-trip-events-service.
    in-progress-before: 30m
    in-progress-after: 30m
    # US-117: alistamiento mínimo de un bus entre la llegada de un viaje y la salida del siguiente.
    bus-turnaround: 30m
    # US-118: hasta cuánto se puede correr una salida hacia adelante y seguir siendo un RETRASO (si no, REPROGRAMACION).
    max-delay: 6h
  seed:
    on-startup: ${SEED_ON_STARTUP:true}
